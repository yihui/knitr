on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      extra-packages:
        description: 'extra package to install for the runs (like a dev version of one of the deps) - comma separated'
        required: false
        type: string


name: Check knitr examples

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  run-examples:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})${{ github.event.inputs.extra-packages && ' - with some extra packages'|| ''}}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      DISPLAY: ':99.0'
      RGL_USE_NULL: TRUE
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2.13.0
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2.13.0

      - uses: r-lib/actions/setup-tinytex@v2.13.0
        env:
          # install full prebuilt version
          TINYTEX_INSTALLER: TinyTeX

      - name: Is this workflow running with extra package
        if: github.event.inputs.extra-packages
        run: |
          echo "::notice::Running with the following extra packages for pak: ${{ github.event.inputs.extra-packages }}"
        shell: bash

      - uses: r-lib/actions/setup-r-dependencies@v2.13.0
        with:
          packages: deps::.
          extra-packages: >
            XML,
            ${{ github.event.inputs.extra-packages }}

      - name: Retrieve knitr-examples
        # On PR, it will checkout same branch if it exists there
        uses: ./.github/actions/checkout-knitr-examples

      # install the example dependencies (R packages, system packages, LaTeX)
      # via knitr-examples' own composite action, so this workflow does not
      # hardcode anything from that repo. The dev version of knitr installed
      # above is preserved (extra-packages is left empty here).
      - name: Install knitr-examples dependencies
        uses: ./knitr-examples/.github/actions/setup
        with:
          working-directory: knitr-examples

      - name: Check knitr-examples
        run: |
          rm knitr-examples/cache -rf
          make integration
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: knitr-examples
          path:
            knitr-examples/*
          retention-days: 7
